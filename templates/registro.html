<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar Conta — Precificação Clínica</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">A'01</div>
    <div class="auth-sub">Crie sua conta — 7 dias grátis</div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
      <div class="campo">
        <label>Nome da clínica ou profissional *</label>
        <input type="text" name="nome_negocio" placeholder="Ex: Dra. Ana Carvalho" required autofocus>
      </div>
      <div class="campo">
        <label>E-mail *</label>
        <input type="email" name="email" placeholder="seu@email.com" required>
      </div>
      <div class="campo">
        <label>Senha * (mínimo 6 caracteres)</label>
        <input type="password" name="senha" placeholder="••••••••" required minlength="6">
      </div>
      <div class="campo">
        <label>Confirmar senha *</label>
        <input type="password" name="confirmar_senha" placeholder="••••••••" required minlength="6">
      </div>
      <div class="campo">
        <label>Logo (opcional — PNG/JPG, máx. 1MB)</label>
        <input type="file" name="logo" accept="image/png,image/jpeg,image/webp" onchange="previewLogo(this)">
        <img id="logo-preview" src="" alt="" style="display:none;max-height:56px;margin-top:8px;border-radius:6px;border:1px solid var(--border)">
      </div>
      <button type="submit" class="btn-primario full">Criar conta e começar →</button>
    </form>

    <div class="auth-link">
      Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
    </div>
  </div>
</div>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('tema') || 'light');
  function previewLogo(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('logo-preview');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
