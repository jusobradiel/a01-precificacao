<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar Senha — Precificação de Serviços</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo-preta.png') }}" alt="A'01 MUD" class="auth-logo-img">
    <div class="auth-sub">Recuperação de senha</div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <p style="font-size:14px;color:var(--muted);margin-bottom:20px;text-align:center">
      Informe seu e-mail e enviaremos um link para redefinir sua senha.
    </p>

    <form method="POST">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="campo">
        <label>E-mail cadastrado</label>
        <input type="email" name="email" placeholder="seu@email.com" required autofocus>
      </div>
      <button type="submit" class="btn-primario full">Enviar link de recuperação</button>
    </form>

    <div class="auth-link" style="margin-top:16px">
      <a href="{{ url_for('login') }}">← Voltar ao login</a>
    </div>
  </div>
</div>
</body>
</html>
