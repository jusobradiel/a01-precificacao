{% extends "base.html" %}
{% block conteudo %}
<h1>Painel Admin</h1>

<div class="secao">
  <h3>Criar Usuário</h3>
  <form method="POST" action="{{ url_for('admin_criar_usuario') }}" class="form-inline">
    <input type="text" name="nome" placeholder="Nome">
    <input type="email" name="email" placeholder="E-mail" required>
    <input type="password" name="senha" placeholder="Senha" required>
    <button type="submit" class="btn-primario">Criar</button>
  </form>
</div>

<div class="secao">
  <h3>Usuários</h3>
  <table>
    <thead><tr><th>Nome</th><th>E-mail</th><th>Admin</th><th></th></tr></thead>
    <tbody>
      {% for u in usuarios %}
      <tr>
        <td>{{ u.nome }}</td>
        <td>{{ u.email }}</td>
        <td>{{ 'Sim' if u.is_admin else 'Não' }}</td>
        <td>
          {% if not u.is_admin %}
          <a href="{{ url_for('admin_excluir_usuario', id=u.id) }}"
             onclick="return confirm('Excluir {{ u.email }}?')">Excluir</a>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
