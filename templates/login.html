<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Precificação Clínica</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo-preta.png') }}" alt="A'01 MUD" class="auth-logo-img">
    <div class="auth-sub">Precificação de Serviços</div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="campo">
        <label>E-mail</label>
        <input type="email" name="email" placeholder="seu@email.com" autofocus required>
      </div>
      <div class="campo">
        <label>Senha</label>
        <div class="input-olho">
          <input type="password" name="senha" id="campo-senha" placeholder="••••••••" required>
          <button type="button" class="btn-olho" onclick="toggleSenha('campo-senha',this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primario full">Entrar</button>
    </form>

    <div class="auth-link">
      <a href="{{ url_for('esqueci_senha') }}">Esqueci minha senha</a>
    </div>
  </div>
</div>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('tema') || 'light');
  function toggleSenha(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.style.opacity = input.type === 'text' ? '1' : '0.5';
  }
</script>
</body>
</html>
