<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Senha — Precificação de Serviços</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo-branca.png') }}" alt="A'01 MUD" class="auth-logo-img">
    <div class="auth-sub">Definir nova senha</div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="campo">
        <label>Nova senha (mínimo 6 caracteres)</label>
        <div class="input-olho">
          <input type="password" name="senha" id="campo-senha" placeholder="••••••••" required minlength="6" autofocus>
          <button type="button" class="btn-olho" onclick="toggleSenha('campo-senha',this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="campo">
        <label>Confirmar nova senha</label>
        <div class="input-olho">
          <input type="password" name="confirmar_senha" id="campo-conf" placeholder="••••••••" required minlength="6">
          <button type="button" class="btn-olho" onclick="toggleSenha('campo-conf',this)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primario full">Salvar nova senha</button>
    </form>

    <div class="auth-link" style="margin-top:16px">
      <a href="{{ url_for('login') }}">← Voltar ao login</a>
    </div>
  </div>
</div>
<script>
  function toggleSenha(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.style.opacity = input.type === 'text' ? '1' : '0.5';
  }
</script>
</body>
</html>
